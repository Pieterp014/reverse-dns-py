[project]
name = "reverse-dns-py"
version = "0.1.1"
description = "Resolves PTR records and confirms them via forward DNS to detect spoofing."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
